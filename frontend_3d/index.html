<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNARIS - Virtual Moon Base 3D Digital Twin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #02030a;
            color: #ffffff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Top Mission Control Bar */
        .hud-header {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 16, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 12px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .hud-title h1 {
            font-size: 1.15rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: #00e5ff;
            text-transform: uppercase;
        }
        .hud-title .sub {
            font-size: 0.75rem;
            color: #8899aa;
            letter-spacing: 1px;
        }
        .hud-metrics {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .metric-pill {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .metric-pill .lbl {
            font-size: 0.65rem;
            color: #8899aa;
            text-transform: uppercase;
        }
        .metric-pill .val {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .status-badge.normal {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .status-badge.critical {
            background: rgba(255, 34, 68, 0.25);
            color: #ff2244;
            border: 1px solid #ff2244;
            animation: pulse-border 1.2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 4px #ff2244; }
            50% { box-shadow: 0 0 16px #ff2244; }
            100% { box-shadow: 0 0 4px #ff2244; }
        }
        /* Floating Inspector Panel */
        #inspector-panel {
            position: absolute;
            bottom: 24px;
            right: 20px;
            width: 320px;
            background: rgba(10, 16, 30, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-radius: 12px;
            padding: 16px;
            z-index: 10;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            transform: translateX(360px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #inspector-panel.visible {
            transform: translateX(0);
        }
        .inspector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .inspector-header h2 {
            font-size: 0.95rem;
            color: #00e5ff;
        }
        .close-btn {
            cursor: pointer;
            color: #8899aa;
            font-size: 1.2rem;
        }
        .close-btn:hover { color: #fff; }
        .desc {
            font-size: 0.75rem;
            color: #99aabb;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
        }
        .stat-card .lbl {
            font-size: 0.65rem;
            color: #778899;
            text-transform: uppercase;
        }
        .stat-card .val {
            font-size: 0.8rem;
            font-weight: 600;
            color: #e0f0ff;
            margin-top: 2px;
        }
        /* Navigation / Camera Helper buttons */
        .controls-toolbar {
            position: absolute;
            bottom: 24px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }
        .ctrl-btn {
            background: rgba(10, 16, 30, 0.8);
            border: 1px solid rgba(0, 229, 255, 0.35);
            color: #00e5ff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .ctrl-btn:hover {
            background: rgba(0, 229, 255, 0.25);
            color: #ffffff;
        }
        .hint-text {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 0.7rem;
            color: #556677;
            pointer-events: none;
        }
    </style>
    <!-- Standard UMD Three.js & OrbitControls for universal local/remote execution -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="hud-header">
        <div class="hud-title">
            <h1>LUNARIS 3D</h1>
            <div class="sub">VIRTUAL DIGITAL TWIN SIMULATION</div>
        </div>
        <div class="hud-metrics">
            <div class="metric-pill">
                <span class="lbl">Mission Clock</span>
                <span class="val" id="hud-mission-day">Sol 1.0</span>
            </div>
            <div class="metric-pill">
                <span class="lbl">Battery</span>
                <span class="val" id="hud-battery">65%</span>
            </div>
            <div class="metric-pill">
                <span class="lbl">Base Integrity</span>
                <span class="val" id="hud-base-health">98.5%</span>
            </div>
            <div class="metric-pill">
                <span class="lbl">Status</span>
                <span class="status-badge normal" id="hud-base-status">NORMAL</span>
            </div>
        </div>
    </div>
    
    <div id="inspector-panel">
        <div class="inspector-header">
            <h2 id="inspector-title">Facility Details</h2>
            <span class="close-btn" onclick="document.getElementById('inspector-panel').classList.remove('visible')">&times;</span>
        </div>
        <div id="inspector-body">
            <p class="desc">Click on any base module in 3D to inspect real-time digital twin telemetry.</p>
        </div>
    </div>
    
    <div class="controls-toolbar">
        <button class="ctrl-btn" onclick="setCam(65, 42, 75, 0, 5, 0)">Base Overview</button>
        <button class="ctrl-btn" onclick="setCam(0, 18, 35, 0, 8, 0)">Habitat</button>
        <button class="ctrl-btn" onclick="setCam(-35, 20, 50, -35, 8, 0)">Solar Arrays</button>
        <button class="ctrl-btn" onclick="focusRover()">Explore Rover</button>
        <button class="ctrl-btn" onclick="toggleAlarm()">Test Visual Alarm</button>
    </div>
    
    <div class="hint-text">Left Click: Orbit • Right Click: Pan • Scroll: Zoom • Click structures to inspect</div>

    <script>
        let scene, camera, renderer, controls, rover, roverAngle = 0;
        let statusRing, ogaBeacon, ledBar, solarA, solarB;
        let isAlarmActive = false;
        const interactables = [];

        function init() {
            const container = document.getElementById('canvas-container');
            const w = window.innerWidth, h = window.innerHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x02030a);
            scene.fog = new THREE.FogExp2(0x02030a, 0.002);

            camera = new THREE.PerspectiveCamera(45, w / h, 1, 1000);
            camera.position.set(65, 42, 75);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 15;
            controls.maxDistance = 250;
            controls.target.set(0, 5, 0);

            buildScene();
            setupRaycast();
            pollTelemetry();
            setInterval(pollTelemetry, 1500);

            window.addEventListener('resize', onResize);
            animate();
        }

        function buildScene() {
            // Ambient and Sun
            scene.add(new THREE.AmbientLight(0x223344, 0.45));
            const sun = new THREE.DirectionalLight(0xffffff, 2.2);
            sun.position.set(-80, 50, 60);
            sun.castShadow = true;
            scene.add(sun);

            // Stars
            const starGeom = new THREE.BufferGeometry();
            const starCount = 2500;
            const pos = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount * 3; i += 3) {
                const u = Math.random(), v = Math.random();
                const theta = u * 2 * Math.PI, phi = Math.acos(2 * v - 1);
                const r = 380 + Math.random() * 40;
                pos[i] = r * Math.sin(phi) * Math.cos(theta);
                pos[i+1] = Math.abs(r * Math.cos(phi)) + 15;
                pos[i+2] = r * Math.sin(phi) * Math.sin(theta);
            }
            starGeom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            scene.add(new THREE.Points(starGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 })));

            // Earth
            const earth = new THREE.Mesh(
                new THREE.SphereGeometry(15, 32, 32),
                new THREE.MeshStandardMaterial({ color: 0x1a5599, emissive: 0x0a2244, roughness: 0.4 })
            );
            earth.position.set(110, 140, -190);
            scene.add(earth);

            // Terrain
            const terrGeom = new THREE.PlaneGeometry(320, 320, 50, 50);
            const p = terrGeom.attributes.position;
            for (let i = 0; i < p.count; i++) {
                const vx = p.getX(i), vy = p.getY(i);
                if (Math.sqrt(vx*vx + vy*vy) > 30) {
                    p.setZ(i, Math.sin(vx * 0.08) * Math.cos(vy * 0.08) * 2.5);
                }
            }
            terrGeom.computeVertexNormals();
            const terrain = new THREE.Mesh(terrGeom, new THREE.MeshStandardMaterial({ color: 0x6e707a, roughness: 0.95, flatShading: true }));
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            scene.add(terrain);

            // Habitat Dome
            const hab = new THREE.Group();
            hab.name = "HABITAT_CORE";
            const dome = new THREE.Mesh(
                new THREE.SphereGeometry(14, 32, 24, 0, Math.PI*2, 0, Math.PI*0.5),
                new THREE.MeshStandardMaterial({ color: 0xddddf0, metalness: 0.8, roughness: 0.25 })
            );
            hab.add(dome);
            hab.add(new THREE.Mesh(
                new THREE.SphereGeometry(14.15, 16, 12, 0, Math.PI*2, 0, Math.PI*0.5),
                new THREE.MeshBasicMaterial({ color: 0x334466, wireframe: true, transparent: true, opacity: 0.3 })
            ));
            statusRing = new THREE.Mesh(
                new THREE.TorusGeometry(14.2, 0.25, 8, 32),
                new THREE.MeshBasicMaterial({ color: 0x00ff88 })
            );
            statusRing.rotation.x = Math.PI / 2;
            statusRing.position.y = 0.4;
            hab.add(statusRing);
            scene.add(hab);
            interactables.push(hab);

            // Greenhouse
            const gh = new THREE.Group();
            gh.name = "GREENHOUSE_DOME";
            gh.add(new THREE.Mesh(
                new THREE.SphereGeometry(8.5, 24, 16, 0, Math.PI*2, 0, Math.PI*0.5),
                new THREE.MeshPhysicalMaterial({ color: 0x44ff88, transmission: 0.7, transparent: true, opacity: 0.6 })
            ));
            const ghL = new THREE.PointLight(0x00ff66, 1.5, 20);
            ghL.position.y = 4;
            gh.add(ghL);
            gh.position.set(26, 0, -12);
            scene.add(gh);
            interactables.push(gh);

            // Solar Arrays
            function makeSolar(name, pos) {
                const grp = new THREE.Group();
                grp.name = name;
                grp.position.set(pos[0], pos[1], pos[2]);
                const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.0, 8, 12), new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.8 }));
                mast.position.y = 4;
                grp.add(mast);
                const gimb = new THREE.Group();
                gimb.position.y = 8;
                grp.add(gimb);
                const panel = new THREE.Mesh(new THREE.BoxGeometry(22, 7.5, 0.4), new THREE.MeshStandardMaterial({ color: 0x0a1e38, metalness: 0.9, roughness: 0.2 }));
                panel.rotation.x = -Math.PI / 4;
                gimb.add(panel);
                scene.add(grp);
                interactables.push(grp);
                return gimb;
            }
            solarA = makeSolar("SOLAR_ARRAY_A", [-35, 0, 22]);
            solarB = makeSolar("SOLAR_ARRAY_B", [-35, 0, -22]);

            // Power Vault
            const vault = new THREE.Group();
            vault.name = "POWER_VAULT";
            vault.position.set(-18, 0, 0);
            const vBox = new THREE.Mesh(new THREE.BoxGeometry(9, 4, 11), new THREE.MeshStandardMaterial({ color: 0x334455, metalness: 0.8 }));
            vBox.position.y = 2;
            vault.add(vBox);
            ledBar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.2, 3.5), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
            ledBar.position.set(4.6, 2, 0);
            vault.add(ledBar);
            scene.add(vault);
            interactables.push(vault);

            // OGA
            const oga = new THREE.Group();
            oga.name = "OGA_CRYOTANK";
            oga.position.set(16, 0, 20);
            const tGeom = new THREE.CylinderGeometry(2.2, 2.2, 7.5, 16);
            const tMat = new THREE.MeshStandardMaterial({ color: 0xe0e8f0, metalness: 0.8 });
            const t1 = new THREE.Mesh(tGeom, tMat); t1.position.set(-1.8, 3.8, 0); oga.add(t1);
            const t2 = new THREE.Mesh(tGeom, tMat); t2.position.set(1.8, 3.8, 0); oga.add(t2);
            ogaBeacon = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
            ogaBeacon.position.y = 8;
            oga.add(ogaBeacon);
            scene.add(oga);
            interactables.push(oga);

            // WRS Plant
            const wrs = new THREE.Group();
            wrs.name = "WRS_FACILITY";
            wrs.position.set(18, 0, -22);
            const wBox = new THREE.Mesh(new THREE.BoxGeometry(7.5, 5.5, 7.5), new THREE.MeshStandardMaterial({ color: 0x446688, metalness: 0.7 }));
            wBox.position.y = 2.75;
            wrs.add(wBox);
            scene.add(wrs);
            interactables.push(wrs);

            // Comms Dish
            const comms = new THREE.Group();
            comms.name = "COMMS_DISH";
            comms.position.set(0, 0, 38);
            const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1.0, 14, 12), new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.8 }));
            tower.position.y = 7;
            comms.add(tower);
            const dish = new THREE.Mesh(new THREE.SphereGeometry(5.5, 24, 16, 0, Math.PI*2, 0, Math.PI*0.35), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, side: THREE.DoubleSide }));
            dish.position.y = 14;
            dish.rotation.x = Math.PI * 0.7;
            dish.rotation.y = -Math.PI * 0.25;
            comms.add(dish);
            scene.add(comms);
            interactables.push(comms);

            // Rover
            rover = new THREE.Group();
            rover.name = "ROVER_ALPHA";
            const rBody = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 2.0), new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.7 }));
            rBody.position.y = 1.4;
            rover.add(rBody);
            const l1 = new THREE.PointLight(0xffffff, 2, 12);
            l1.position.set(1.8, 1.4, 0.7);
            rover.add(l1);
            rover.position.set(15, 0, 32);
            scene.add(rover);
            interactables.push(rover);
        }

        function setupRaycast() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            window.addEventListener('click', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(interactables, true);
                if (hits.length > 0) {
                    let obj = hits[0].object;
                    while (obj.parent && !interactables.includes(obj)) {
                        obj = obj.parent;
                    }
                    showInspector(obj.name);
                }
            });
        }

        async function pollTelemetry() {
            try {
                const res = await fetch('http://127.0.0.1:8000/api/status');
                if (res.ok) {
                    const data = await res.json();
                    const t = data.telemetry || {};
                    document.getElementById('hud-mission-day').innerText = `Sol ${(t.mission_day || 1).toFixed(1)}`;
                    document.getElementById('hud-battery').innerText = `${(t.battery_pct || 65).toFixed(0)}%`;
                    document.getElementById('hud-base-health').innerText = `${(t.base_health_pct || 98.5).toFixed(1)}%`;
                    const statusEl = document.getElementById('hud-base-status');
                    statusEl.innerText = t.base_status || 'NORMAL';
                    statusEl.className = `status-badge ${(t.base_status || 'normal').toLowerCase()}`;
                    isAlarmActive = (data.active_faults && data.active_faults.length > 0);
                    if (ledBar) {
                        const b = t.battery_pct || 65;
                        ledBar.material.color.setHex(b < 25 ? 0xff2244 : (b < 50 ? 0xffaa00 : 0x00ff88));
                    }
                }
            } catch (e) {}
        }

        function showInspector(name) {
            const insp = document.getElementById('inspector-panel');
            const title = document.getElementById('inspector-title');
            const body = document.getElementById('inspector-body');

            const info = {
                "HABITAT_CORE": {
                    name: "Central Pressurized Habitat",
                    desc: "Geodesic biosphere dome with crew quarters, life-support avionics, and airlock.",
                    stats: [["Pressure", "101.3 kPa"], ["Temp", "21.5 °C"], ["Occupants", "4 Astronauts"], ["Status", "NOMINAL"]]
                },
                "GREENHOUSE_DOME": {
                    name: "Hydroponic Greenhouse",
                    desc: "Bio-regenerative agriculture generating fresh microgreens and supplemental O2.",
                    stats: [["Harvest", "+0.6 kg/day"], ["Lighting", "100% LEDs"], ["Cycle", "Optimal"]]
                },
                "SOLAR_ARRAY_A": {
                    name: "Photovoltaic Array Alpha",
                    desc: "Dual-axis solar tracking station with 32% space-grade multi-junction cells.",
                    stats: [["Output", "60.0 kW"], ["Efficiency", "32%"], ["Status", "Tracking Sun"]]
                },
                "SOLAR_ARRAY_B": {
                    name: "Photovoltaic Array Beta",
                    desc: "Secondary solar tracking array with electrostatic regolith dust mitigation.",
                    stats: [["Output", "60.0 kW"], ["Dust Cover", "2.1%"], ["Status", "Tracking Sun"]]
                },
                "POWER_VAULT": {
                    name: "Subsurface Battery Bank",
                    desc: "500 kWh Li-S cryogenic battery bank and 40 kW auxiliary fuel cell generator.",
                    stats: [["Storage", "500 kWh"], ["Aux Cell", "STANDBY"], ["Health", "96.0%"]]
                },
                "OGA_CRYOTANK": {
                    name: "Oxygen Generation Assembly (OGA)",
                    desc: "Electrolysis unit splitting recycled water into breathable O2 and hydrogen.",
                    stats: [["Capacity", "200 kg"], ["Rate", "8.0 kg/day"], ["Reserve", "50 kg Aux"]]
                },
                "WRS_FACILITY": {
                    name: "Water Recovery System (WRS)",
                    desc: "Closed-loop wastewater purification and urine distillation plant.",
                    stats: [["Tank", "1000 L"], ["Recycled", "40.0 L/day"], ["Recovery", "90% Eff"]]
                },
                "COMMS_DISH": {
                    name: "Earth High-Gain Satellite Dish",
                    desc: "Deep space parabolic dish maintaining telemetry uplink with Earth networks.",
                    stats: [["Latency", "1.28 sec"], ["Signal", "99.8%"], ["Target", "Earth Locked"]]
                },
                "ROVER_ALPHA": {
                    name: "Autonomous Exploration Rover 1",
                    desc: "6-wheeled robotic surface explorer conducting geologic surveys.",
                    stats: [["Battery", "88%"], ["Telemetry", "Patrol Survey"], ["Traction", "Optimal"]]
                }
            }[name] || { name: name, desc: "Moon Base Modular Subsystem Facility", stats: [] };

            title.innerText = info.name;
            let html = `<p class="desc">${info.desc}</p><div class="stats-grid">`;
            for (const s of info.stats) {
                html += `<div class="stat-card"><span class="lbl">${s[0]}</span><span class="val">${s[1]}</span></div>`;
            }
            html += `</div>`;
            body.innerHTML = html;
            insp.classList.add('visible');
        }

        window.setCam = function(x, y, z, tx, ty, tz) {
            camera.position.set(x, y, z);
            controls.target.set(tx, ty, tz);
        };

        window.focusRover = function() {
            if (rover) {
                camera.position.set(rover.position.x + 12, 10, rover.position.z + 14);
                controls.target.copy(rover.position);
            }
        };

        window.toggleAlarm = function() {
            isAlarmActive = !isAlarmActive;
            if (statusRing) statusRing.material.color.setHex(isAlarmActive ? 0xff0000 : 0x00ff88);
        };

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            if (rover) {
                roverAngle += 0.006;
                const r = 26;
                rover.position.x = Math.cos(roverAngle) * r;
                rover.position.z = Math.sin(roverAngle) * (r * 0.8) + 8;
                rover.rotation.y = -roverAngle + Math.PI / 2;
            }

            if (solarA) {
                const tilt = Math.sin(time * 0.2) * 0.12;
                solarA.rotation.y = tilt;
                solarB.rotation.y = tilt;
            }

            if (isAlarmActive && statusRing) {
                const strobe = Math.sin(time * 6.0) > 0 ? 0xff0000 : 0x440000;
                statusRing.material.color.setHex(strobe);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
